app = "radar-financeiro-mvp"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  DEBUG = "false"
  JWT_EXPIRE_MINUTES = "60"
  DATABASE_URL = "sqlite:///data/app.db"
  LOG_LEVEL = "INFO"
  ALLOWED_ORIGINS = "https://radar-financeiro-mvp.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"